<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 980" width="1100" height="980" role="img" aria-labelledby="title desc">
  <title id="title">Corriente Peng — MiMo as residual current</title>
  <desc id="desc">One residual river through two memory viscosities and MoE vortices; NVMe snow; estuary mouth.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="40%" stop-color="#22d3ee" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#67e8f9" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="snow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="fullVis" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="swaVis" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="vortex" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#e879f9"/>
    </linearGradient>
    <linearGradient id="mouth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#67e8f9"/>
    </marker>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0 H0 V32" fill="none" stroke="#1e293b" stroke-width="0.6"/>
    </pattern>
  </defs>

  <rect width="1100" height="980" fill="url(#bg)"/>
  <rect width="1100" height="980" fill="url(#grid)" opacity="0.4"/>

  <text x="40" y="42" fill="#f8fafc" font-family="ui-sans-serif,system-ui,Segoe UI,sans-serif" font-size="26" font-weight="700">Corriente Peng — MiMo as residual current</text>
  <text x="40" y="68" fill="#94a3b8" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14">One thread · two memory viscosities · vortices (MoE) · snow (NVMe) · estuary (lm_head) · form provisional, Being = residual</text>

  <!-- Legend -->
  <g transform="translate(40,88)">
    <rect width="1020" height="44" rx="10" fill="#0f172a" stroke="#334155"/>
    <rect x="16" y="14" width="16" height="16" rx="3" fill="#22d3ee"/>
    <text x="40" y="27" fill="#e2e8f0" font-size="12" font-family="ui-sans-serif,system-ui,sans-serif">Water = residual</text>
    <rect x="180" y="14" width="16" height="16" rx="3" fill="url(#fullVis)"/>
    <text x="204" y="27" fill="#e2e8f0" font-size="12" font-family="ui-sans-serif,system-ui,sans-serif">Full viscosity (9)</text>
    <rect x="360" y="14" width="16" height="16" rx="3" fill="url(#swaVis)"/>
    <text x="384" y="27" fill="#e2e8f0" font-size="12" font-family="ui-sans-serif,system-ui,sans-serif">SWA ring viscosity (39)</text>
    <circle cx="580" cy="22" r="8" fill="url(#vortex)"/>
    <text x="598" y="27" fill="#e2e8f0" font-size="12" font-family="ui-sans-serif,system-ui,sans-serif">Vortex = expert (8 of 256 fire)</text>
    <rect x="820" y="14" width="16" height="16" rx="3" fill="url(#snow)"/>
    <text x="844" y="27" fill="#e2e8f0" font-size="12" font-family="ui-sans-serif,system-ui,sans-serif">Snow = disk weights</text>
  </g>

  <!-- Summit snow -->
  <g transform="translate(40,160)">
    <rect width="280" height="280" rx="16" fill="#0f172a" stroke="#475569"/>
    <text x="16" y="32" fill="#cbd5e1" font-size="15" font-weight="700" font-family="ui-sans-serif,system-ui,sans-serif">① Summit — snow</text>
    <text x="16" y="54" fill="#64748b" font-size="12" font-family="ui-sans-serif,system-ui,sans-serif">NVMe · 12,032 int4 experts</text>
    <!-- snow drifts -->
    <rect x="24" y="80" width="232" height="28" rx="6" fill="url(#snow)" opacity="0.9"/>
    <rect x="40" y="118" width="200" height="22" rx="6" fill="url(#snow)" opacity="0.7"/>
    <rect x="56" y="150" width="168" height="18" rx="6" fill="url(#snow)" opacity="0.5"/>
    <rect x="72" y="178" width="136" height="14" rx="6" fill="url(#snow)" opacity="0.35"/>
    <text x="16" y="230" fill="#94a3b8" font-size="12" font-family="ui-sans-serif,system-ui,sans-serif">Potential mass · random climb = miss</text>
    <text x="16" y="252" fill="#7dd3fc" font-size="12" font-family="ui-sans-serif,system-ui,sans-serif">thaw = WILLNEED · TRAJ · path-pack</text>
    <text x="16" y="274" fill="#64748b" font-size="11" font-family="ui-sans-serif,system-ui,sans-serif">habit digs channels in the snowpack</text>
  </g>

  <!-- Valley / river -->
  <g transform="translate(360,160)">
    <rect width="400" height="520" rx="16" fill="#0f172a" stroke="#334155"/>
    <text x="16" y="32" fill="#f8fafc" font-size="15" font-weight="700" font-family="ui-sans-serif,system-ui,sans-serif">② Valley — one residual river</text>
    <text x="16" y="52" fill="#64748b" font-size="12" font-family="ui-sans-serif,system-ui,sans-serif">D = 4096 · the only subject</text>

    <!-- river body -->
    <path d="M200 70 C 160 120, 240 160, 200 210 C 150 270, 250 320, 200 380 C 160 430, 230 470, 200 510"
          fill="none" stroke="url(#river)" stroke-width="28" stroke-linecap="round" filter="url(#glow)" opacity="0.95"/>
    <path d="M200 70 C 160 120, 240 160, 200 210 C 150 270, 250 320, 200 380 C 160 430, 230 470, 200 510"
          fill="none" stroke="#e0f2fe" stroke-width="3" stroke-linecap="round" opacity="0.85"/>

    <!-- layer 0 foundation -->
    <rect x="120" y="68" width="160" height="36" rx="8" fill="#b45309" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="200" y="90" text-anchor="middle" fill="#fef3c7" font-size="11" font-weight="700" font-family="ui-sans-serif,system-ui,sans-serif">layer 0 dense · foundation</text>

    <!-- full viscosity bands -->
    <rect x="40" y="140" width="90" height="50" rx="8" fill="url(#fullVis)" opacity="0.85"/>
    <text x="85" y="162" text-anchor="middle" fill="#eff6ff" font-size="10" font-weight="700" font-family="ui-sans-serif,system-ui,sans-serif">FULL</text>
    <text x="85" y="178" text-anchor="middle" fill="#dbeafe" font-size="9" font-family="ui-sans-serif,system-ui,sans-serif">whole history</text>

    <rect x="40" y="300" width="90" height="50" rx="8" fill="url(#fullVis)" opacity="0.75"/>
    <text x="85" y="330" text-anchor="middle" fill="#eff6ff" font-size="10" font-weight="700" font-family="ui-sans-serif,system-ui,sans-serif">FULL</text>

    <!-- SWA rings -->
    <circle cx="320" cy="200" r="34" fill="none" stroke="#14b8a6" stroke-width="6" opacity="0.9"/>
    <circle cx="320" cy="200" r="18" fill="none" stroke="#5eead4" stroke-width="2" opacity="0.7"/>
    <text x="320" y="204" text-anchor="middle" fill="#ccfbf1" font-size="10" font-weight="700" font-family="ui-sans-serif,system-ui,sans-serif">SWA</text>
    <text x="320" y="250" text-anchor="middle" fill="#5eead4" font-size="9" font-family="ui-sans-serif,system-ui,sans-serif">ring 128</text>

    <circle cx="320" cy="360" r="34" fill="none" stroke="#14b8a6" stroke-width="6" opacity="0.75"/>
    <circle cx="320" cy="360" r="18" fill="none" stroke="#5eead4" stroke-width="2" opacity="0.55"/>
    <text x="320" y="364" text-anchor="middle" fill="#ccfbf1" font-size="10" font-weight="700" font-family="ui-sans-serif,system-ui,sans-serif">SWA</text>

    <!-- vortices along river -->
    <g opacity="0.95">
      <circle cx="175" cy="230" r="11" fill="url(#vortex)"/>
      <circle cx="230" cy="250" r="9" fill="url(#vortex)" opacity="0.85"/>
      <circle cx="185" cy="275" r="10" fill="url(#vortex)" opacity="0.9"/>
      <circle cx="220" cy="295" r="8" fill="#312e81" opacity="0.4"/>
      <circle cx="165" cy="310" r="7" fill="#312e81" opacity="0.3"/>
      <circle cx="240" cy="330" r="10" fill="url(#vortex)"/>
      <circle cx="190" cy="350" r="9" fill="url(#vortex)" opacity="0.8"/>
      <circle cx="225" cy="375" r="8" fill="url(#vortex)" opacity="0.7"/>
      <circle cx="180" cy="400" r="7" fill="#312e81" opacity="0.25"/>
      <circle cx="210" cy="420" r="11" fill="url(#vortex)"/>
      <circle cx="195" cy="450" r="9" fill="url(#vortex)" opacity="0.85"/>
    </g>
    <text x="200" y="500" text-anchor="middle" fill="#e9d5ff" font-size="11" font-family="ui-sans-serif,system-ui,sans-serif">vortices = MoE · bright = top-8 fire · dim = sleep</text>
  </g>

  <!-- Plain residency -->
  <g transform="translate(800,160)">
    <rect width="260" height="280" rx="16" fill="#0f172a" stroke="#059669"/>
    <text x="16" y="32" fill="#a7f3d0" font-size="15" font-weight="700" font-family="ui-sans-serif,system-ui,sans-serif">③ Plain — hold</text>
    <text x="16" y="54" fill="#64748b" font-size="12" font-family="ui-sans-serif,system-ui,sans-serif">thawed mass · no mountain climb</text>
    <rect x="20" y="80" width="220" height="48" rx="8" fill="#065f46" stroke="#34d399"/>
    <text x="30" y="100" fill="#d1fae5" font-size="12" font-weight="700" font-family="ui-sans-serif,system-ui,sans-serif">VRAM · gpu_pin</text>
    <text x="30" y="118" fill="#6ee7b7" font-size="11" font-family="ui-sans-serif,system-ui,sans-serif">hottest vortices · moe_acc</text>
    <rect x="20" y="140" width="220" height="48" rx="8" fill="#1e3a8a" stroke="#60a5fa"/>
    <text x="30" y="160" fill="#dbeafe" font-size="12" font-weight="700" font-family="ui-sans-serif,system-ui,sans-serif">RAM · PIN + LRU</text>
    <text x="30" y="178" fill="#93c5fd" font-size="11" font-family="ui-sans-serif,system-ui,sans-serif">learned habit · ecap</text>
    <rect x="20" y="200" width="220" height="48" rx="8" fill="#312e81" stroke="#a78bfa"/>
    <text x="30" y="220" fill="#ede9fe" font-size="12" font-weight="700" font-family="ui-sans-serif,system-ui,sans-serif">bitmaps res | pref</text>
    <text x="30" y="238" fill="#c4b5fd" font-size="11" font-family="ui-sans-serif,system-ui,sans-serif">presence as 0/1 · no list fear</text>
  </g>

  <!-- Estuary -->
  <g transform="translate(800,470)">
    <rect width="260" height="210" rx="16" fill="#0f172a" stroke="#f59e0b"/>
    <text x="16" y="32" fill="#fde68a" font-size="15" font-weight="700" font-family="ui-sans-serif,system-ui,sans-serif">④ Estuary — mouth</text>
    <text x="16" y="54" fill="#64748b" font-size="12" font-family="ui-sans-serif,system-ui,sans-serif">lm_head · vapor · name</text>
    <path d="M40 90 L130 160 L220 90 Z" fill="url(#mouth)" opacity="0.85"/>
    <text x="130" y="130" text-anchor="middle" fill="#422006" font-size="12" font-weight="700" font-family="ui-sans-serif,system-ui,sans-serif">vocab</text>
    <text x="16" y="185" fill="#fcd34d" font-size="11" font-family="ui-sans-serif,system-ui,sans-serif">water arrives already whole</text>
    <text x="16" y="203" fill="#92400e" font-size="11" font-family="ui-sans-serif,system-ui,sans-serif">mouth only articulates</text>
  </g>

  <!-- Flow arrows from snow to valley -->
  <path d="M320 280 H350" stroke="#67e8f9" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="322" y="270" fill="#67e8f9" font-size="10" font-family="ui-sans-serif,system-ui,sans-serif">thaw</text>
  <path d="M760 300 H790" stroke="#34d399" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="762" y="290" fill="#34d399" font-size="10" font-family="ui-sans-serif,system-ui,sans-serif">hold</text>
  <path d="M560 680 V720" stroke="#fbbf24" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Bottom formula -->
  <g transform="translate(40,720)">
    <rect width="720" height="200" rx="14" fill="#0f172a" stroke="#334155"/>
    <text x="20" y="36" fill="#f1f5f9" font-size="16" font-weight="700" font-family="ui-sans-serif,system-ui,sans-serif">Hydrologic cycle per token (same math as the net — new conception)</text>
    <text x="20" y="70" fill="#e2e8f0" font-size="13" font-family="ui-monospace,Consolas,monospace">inflow (prompt / prev token)</text>
    <text x="20" y="94" fill="#94a3b8" font-size="13" font-family="ui-sans-serif,system-ui,sans-serif">+ thaw(habit channels) + hold(plain vortices) + shear(attn · MoE bed)</text>
    <text x="20" y="118" fill="#94a3b8" font-size="13" font-family="ui-sans-serif,system-ui,sans-serif">− evaporate(sample) = mouth(vocab height)</text>
    <text x="20" y="152" fill="#67e8f9" font-size="13" font-family="ui-sans-serif,system-ui,sans-serif">Net dialect: layers · experts · matmul · pread</text>
    <text x="20" y="176" fill="#a78bfa" font-size="13" font-family="ui-sans-serif,system-ui,sans-serif">River truth: one thread · pressure · bed · discharge (tok/s)</text>
  </g>

  <text x="40" y="960" fill="#475569" font-size="11" font-family="ui-sans-serif,system-ui,sans-serif">peng-mimo · docs/diagrams/corriente-peng.svg · manifesto: docs/corriente-peng.md · form provisional · Being = residual</text>
</svg>
